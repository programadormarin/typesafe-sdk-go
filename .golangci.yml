version: "2"
linters:
  enable:
    - godot
    - misspell
    - unconvert
    - unparam
  settings:
    godot:
      scope: declarations
      capital: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: examples/
      - linters:
          - unparam
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
